[package]
name = "OsmanthusBot"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0.150"

#serenity = { version = "0.12.5", git = "https://github.com/serenity-rs/serenity.git", features = ["client", "standard_framework", "voice"], workspace = true }
serenity = { features = ["cache", "framework", "standard_framework", "voice", "http", "rustls_backend"], version = "0.12.5"}
songbird = { version = "0.6.0", default-features = true, features = ["builtin-queue"] }
symphonia = { features = ["aac", "mp3", "isomp4", "alac"], version = "0.5.0" }
reqwest = "0.12"
